name: BELL Desktop Build & Release

on:
  push:
    tags:
      - "v*"
      - "desktop-v*"
  pull_request:
    paths:
      - "desktop/**"
      - "contracts/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to build (all, suite, personal, explain, pr, reader, campaign)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - suite
          - personal
          - explain
          - pr
          - reader
          - campaign

permissions:
  contents: read

env:
  NODE_RUNTIME_VERSION: "22.22.1"

jobs:
  prepare-bundles:
    name: Bundle & Verify 5 Sidecars + Pure-Rust Hub
    runs-on: ubuntu-latest
    outputs:
      editions: ${{ steps.matrix.outputs.editions }}
    steps:
      - name: Resolve target editions matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EDITION: ${{ inputs.edition }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo 'editions=["suite"]' >> "${GITHUB_OUTPUT}"
          elif [ -n "${INPUT_EDITION:-}" ] && [ "${INPUT_EDITION}" != "all" ]; then
            printf 'editions=["%s"]\n' "${INPUT_EDITION}" >> "${GITHUB_OUTPUT}"
          else
            echo 'editions=["suite","personal","explain","pr","reader","campaign"]' >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout bell-suite
        uses: actions/checkout@v4
        with:
          path: bell-suite

      - name: Enforce Zero-TypeScript Gate on desktop/
        run: |
          set -euo pipefail
          ts_files="$(find bell-suite/desktop -type f \( -name '*.ts' -o -name '*.tsx' \) || true)"
          if [ -n "${ts_files}" ]; then
            echo "ERROR: TypeScript files are forbidden in desktop/: ${ts_files}" >&2
            exit 1
          fi
          echo "Zero-TypeScript Gate passed (0 .ts/.tsx files in desktop/)."

      - name: Checkout BELL Personal
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/BELL-Personal
          path: bell-personal

      - name: Checkout BELL Explain
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/BELL-Explain
          path: bell-explain

      - name: Checkout BELL PR
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bell-pr
          path: bell-pr

      - name: Checkout BELL Web Reader
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bell-reader
          path: bell-reader

      - name: Checkout BELL Campaign
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bell-campaign
          path: bell-campaign

      - name: Setup Node.js v${{ env.NODE_RUNTIME_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RUNTIME_VERSION }}

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust workspace target (hub)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "bell-suite/desktop -> target"
          key: linux-hub

      - name: Verify BELL Suite contract & CLI test suite
        working-directory: bell-suite
        run: npm test

      - name: Test & build Pure-Rust BELL Hub (bell-hub -> hub-dist)
        working-directory: bell-suite
        run: |
          cargo test --manifest-path desktop/Cargo.toml -p bell-core -p bell-hub -p bell-daemon
          cargo run --manifest-path desktop/Cargo.toml -p bell-hub --bin build-hub-dist
          test -f desktop/hub-dist/index.html
          test -f desktop/hub-dist/hub.css

      - name: Install & build all 5 workspace frontends
        run: |
          set -euo pipefail
          for app_dir in bell-personal bell-explain bell-pr bell-reader bell-campaign; do
            echo "::group::Building ${app_dir}"
            if [ -f "${app_dir}/package-lock.json" ]; then
              npm --prefix "${app_dir}" ci --no-audit --no-fund
            else
              npm --prefix "${app_dir}" install --no-audit --no-fund
            fi
            npm --prefix "${app_dir}" run build
            echo "::endgroup::"
          done

      - name: Generate edition icons & smoke-verify minified zero-node_modules sidecars
        working-directory: bell-suite
        env:
          BELL_SUITE_APP_PERSONAL: ${{ github.workspace }}/bell-personal
          BELL_SUITE_APP_EXPLAIN: ${{ github.workspace }}/bell-explain
          BELL_SUITE_APP_PR: ${{ github.workspace }}/bell-pr
          BELL_SUITE_APP_READER: ${{ github.workspace }}/bell-reader
          BELL_SUITE_APP_CAMPAIGN: ${{ github.workspace }}/bell-campaign
        run: |
          node desktop/scripts/generate-icons.mjs
          node desktop/scripts/bundle-sidecars.mjs --verify
          node desktop/scripts/prepare-edition.mjs all

      - name: Upload bundled sidecar apps
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sidecars-apps
          path: bell-suite/desktop/dist-sidecars/apps
          retention-days: 7

      - name: Upload built Pure-Rust Hub dist
        uses: actions/upload-artifact@v4
        with:
          name: desktop-hub-dist
          path: bell-suite/desktop/hub-dist
          retention-days: 7

  create-release:
    name: Create Unified Draft Release
    needs: prepare-bundles
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or reuse draft GitHub Release for ${{ github.ref_name }}
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace(/^refs\/tags\//, "");
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            let existing = releases.find((r) => r.tag_name === tagName);
            if (!existing) {
              const isPreviewTag = tagName.startsWith("desktop-v");
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                name: `BELL Desktop ${tagName}`,
                body: [
                  "Native macOS **Apple Silicon (`_aarch64.dmg` / `_aarch64.app.tar.gz`)**, **Intel (`_x64.dmg` / `_x64.app.tar.gz`)**, and **Windows x64 (`.msi` / `-setup.exe`)** installers for **BELL Suite** and all 5 standalone workspaces (**Personal**, **Explain**, **PR**, **Web Reader**, **Campaign**).",
                  "",
                  "- **Instant macOS Launch (`v1.0.5`)**: single-archive `apps.tar.gz` sidecar bundle (`4` sealed files in `CodeResources`) + stripped native `arm64`/`x64` Mach-O binaries (`bell-desktop` + `bell-runtime`).",
                  "- **Auto-Provisioned Personal Vault & System-Browser Google OAuth (`v1.0.5`)**: automatically generates a persistent local 256-bit AES-GCM master key (`personal-secrets/master.key`, `0600`) for Google, E3, Canvas, private calendars, and saved API keys, and opens `/oauth/*` flows in the system browser.",
                  "- **Pure-Rust `bell-hub` Shell**: standard `WebviewWindow`, zero TypeScript, built-in `SuiteSwitcher` + `⌘0`–`⌘5` / `Ctrl+0`–`Ctrl+5`.",
                  "- **Embedded Node.js `v22.22.1` LTS Runtime**: SHA-256 verified — zero external Node installation required.",
                  "- **macOS first-launch tip (unsigned preview)**: drag the app to `/Applications`, then run `xattr -cr \"/Applications/BELL Suite.app\"` (or right-click → Open) if Gatekeeper prompts.",
                ].join("\n"),
                draft: !isPreviewTag,
                prerelease: isPreviewTag,
              });
              existing = created.data;
            }
            core.info(`Using GitHub Release id=${existing.id} for tag=${tagName}`);
            core.setOutput("release_id", String(existing.id));

  build-installers:
    name: Build ${{ matrix.edition }} (${{ matrix.platform.os_label }})
    needs:
      - prepare-bundles
      - create-release
    if: >-
      always() &&
      needs.prepare-bundles.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.prepare-bundles.outputs.editions) }}
        platform:
          - os: macos-latest
            os_label: macos-arm64
            rust_targets: "aarch64-apple-darwin"
            tauri_args: "--target aarch64-apple-darwin"
            node_arch: "arm64"
            bundle_arch: "aarch64"
          - os: macos-latest
            os_label: macos-x64
            rust_targets: "x86_64-apple-darwin"
            tauri_args: "--target x86_64-apple-darwin"
            node_arch: "x64"
            bundle_arch: "x64"
          - os: windows-latest
            os_label: windows-x64
            rust_targets: "x86_64-pc-windows-msvc"
            tauri_args: "--target x86_64-pc-windows-msvc"
            node_arch: "x64"
            bundle_arch: "x64"

    steps:
      - name: Checkout bell-suite
        uses: actions/checkout@v4

      - name: Setup Node.js v${{ env.NODE_RUNTIME_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_RUNTIME_VERSION }}

      - name: Install Tauri CLI v2
        run: npm install -g @tauri-apps/cli@^2

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_targets }}

      - name: Cache Rust workspace target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"
          key: ${{ matrix.platform.os_label }}

      - name: Download bundled sidecar apps
        uses: actions/download-artifact@v4
        with:
          name: desktop-sidecars-apps
          path: desktop/dist-sidecars/apps

      - name: Download Pure-Rust Hub dist
        uses: actions/download-artifact@v4
        with:
          name: desktop-hub-dist
          path: desktop/hub-dist

      - name: Embed, strip & codesign official Node v${{ env.NODE_RUNTIME_VERSION }} (${{ matrix.platform.os_label }})
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NODE_ARCH: ${{ matrix.platform.node_arch }}
        run: |
          set -euo pipefail
          VER="${NODE_RUNTIME_VERSION}"
          BASE_URL="https://nodejs.org/dist/v${VER}"
          TARBALL="node-v${VER}-darwin-${NODE_ARCH}.tar.gz"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT

          pushd "${TMP_DIR}" >/dev/null
          curl -fsSLO "${BASE_URL}/SHASUMS256.txt"
          curl -fsSLO "${BASE_URL}/${TARBALL}"

          grep -E "  node-v${VER}-darwin-${NODE_ARCH}\.tar\.gz$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "${TARBALL}"

          mkdir -p "${GITHUB_WORKSPACE}/desktop/dist-sidecars/bin"
          cp "node-v${VER}-darwin-${NODE_ARCH}/bin/node" "${GITHUB_WORKSPACE}/desktop/dist-sidecars/bin/bell-runtime"
          popd >/dev/null

          chmod 0755 desktop/dist-sidecars/bin/bell-runtime
          ls -lh desktop/dist-sidecars/bin/bell-runtime
          strip -x desktop/dist-sidecars/bin/bell-runtime
          ls -lh desktop/dist-sidecars/bin/bell-runtime

          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --timestamp --options runtime \
              --entitlements desktop/editions/entitlements.runtime.macos.plist \
              desktop/dist-sidecars/bin/bell-runtime
          else
            codesign --force --sign - --timestamp=none \
              --entitlements desktop/editions/entitlements.runtime.macos.plist \
              desktop/dist-sidecars/bin/bell-runtime
          fi

          file desktop/dist-sidecars/bin/bell-runtime
          if [ "${NODE_ARCH}" = "arm64" ]; then
            ./desktop/dist-sidecars/bin/bell-runtime --version
          fi

      - name: Embed official Node v${{ env.NODE_RUNTIME_VERSION }} x64 runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:NODE_RUNTIME_VERSION
          $baseUrl = "https://nodejs.org/dist/v$ver"
          $zipName = "node-v$ver-win-x64.zip"
          $tmpDir = Join-Path ([System.IO.Path]::GetTempPath()) ("bell-node-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null

          try {
            $shasumsPath = Join-Path $tmpDir "SHASUMS256.txt"
            $zipPath = Join-Path $tmpDir $zipName
            Invoke-WebRequest -Uri "$baseUrl/SHASUMS256.txt" -OutFile $shasumsPath
            Invoke-WebRequest -Uri "$baseUrl/$zipName" -OutFile $zipPath

            $expectedLine = Select-String -Path $shasumsPath -Pattern "  $([regex]::Escape($zipName))$" | Select-Object -First 1
            if (-not $expectedLine) { throw "Missing checksum for $zipName in SHASUMS256.txt" }
            $expectedHash = ($expectedLine.Line -split '\s+')[0].ToLowerInvariant()
            $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "SHA-256 mismatch for ${zipName}: expected $expectedHash, got $actualHash"
            }

            Expand-Archive -Path $zipPath -DestinationPath $tmpDir -Force
            $binDir = Join-Path $env:GITHUB_WORKSPACE "desktop\dist-sidecars\bin"
            New-Item -ItemType Directory -Force -Path $binDir | Out-Null
            $runtimeExe = Join-Path $binDir "bell-runtime.exe"
            Copy-Item -Path (Join-Path $tmpDir "node-v$ver-win-x64\node.exe") -Destination $runtimeExe -Force
            & $runtimeExe --version
          } finally {
            Remove-Item -Recurse -Force $tmpDir -ErrorAction SilentlyContinue
          }

      - name: Generate icons & stage single-archive edition config (${{ matrix.edition }})
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          node -e 'const fs=require("node:fs"),p=require("node:path");if(fs.existsSync("desktop/target")){for(const d of fs.readdirSync("desktop/target",{withFileTypes:true})){if(d.isDirectory())fs.rmSync(p.join("desktop/target",d.name,"release","bundle"),{recursive:true,force:true});}}'
          node desktop/scripts/generate-icons.mjs
          node desktop/scripts/prepare-edition.mjs ${{ matrix.edition }} --stage-resources --apply

      - name: Check Apple code-signing certificate availability
        id: apple_cert
        env:
          CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE }}
        shell: bash
        run: |
          if [ -n "${CERT_PRESENT:-}" ]; then
            echo "has_cert=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cert=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Tauri v2 installer (Unsigned / Ad-hoc Preview)
        if: ${{ steps.apple_cert.outputs.has_cert != 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          BELL_DESKTOP_EDITION: ${{ matrix.edition }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: desktop/crates/bell-tauri
          tauriScript: tauri
          includeUpdaterJson: false
          args: ${{ matrix.platform.tauri_args }}

      - name: Build Tauri v2 installer (Developer ID Signed & Notarized)
        if: ${{ steps.apple_cert.outputs.has_cert == 'true' }}
        uses: tauri-apps/tauri-action@v0
        env:
          BELL_DESKTOP_EDITION: ${{ matrix.edition }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop/crates/bell-tauri
          tauriScript: tauri
          includeUpdaterJson: false
          args: ${{ matrix.platform.tauri_args }}

      - name: Verify macOS .app signature, sealed file count & millisecond launch benchmark (${{ matrix.edition }} - ${{ matrix.platform.os_label }})
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_APPLE_CERT: ${{ steps.apple_cert.outputs.has_cert }}
          RUST_TARGET: ${{ matrix.platform.rust_targets }}
          NODE_ARCH: ${{ matrix.platform.node_arch }}
          BUNDLE_ARCH: ${{ matrix.platform.bundle_arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(desktop/target/"${RUST_TARGET}"/release/bundle/macos/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly 1 .app bundle in desktop/target/${RUST_TARGET}/release/bundle/macos/, found ${#apps[@]}" >&2
            exit 1
          fi
          APP_BUNDLE="${apps[0]}"
          APP_BIN="${APP_BUNDLE}/Contents/MacOS/bell-desktop"

          echo "=== Inspecting code signature & sealed resource count for ${APP_BUNDLE} ==="
          du -sh "${APP_BUNDLE}" "${APP_BIN}"
          codesign -dvvv "${APP_BIN}" 2>&1 | tee /tmp/bell-codesign.txt
          if [ "${HAS_APPLE_CERT}" != "true" ] && grep -Eq "flags=0x[0-9a-fA-F]*\\(.*runtime" /tmp/bell-codesign.txt; then
            echo "ERROR: Ad-hoc build must NOT carry CS_RUNTIME (Hardened Runtime) flag!" >&2
            exit 1
          fi

          RES_FILE_COUNT="$(find "${APP_BUNDLE}/Contents/Resources" -type f | wc -l | tr -d ' ')"
          SEALED_COUNT="$(sed -n 's/^Sealed Resources.*files=\([0-9][0-9]*\).*/\1/p' /tmp/bell-codesign.txt | head -n 1)"
          SEALED_COUNT="${SEALED_COUNT:-${RES_FILE_COUNT}}"
          echo "BUNDLE_RESOURCES_FILES=${RES_FILE_COUNT} SEALED_RESOURCES_COUNT=${SEALED_COUNT}"
          find "${APP_BUNDLE}/Contents/Resources" -type f
          if [ "${SEALED_COUNT}" -gt 15 ] || [ "${RES_FILE_COUNT}" -gt 15 ]; then
            echo "ERROR: Expected <= 15 sealed resource files (single apps.tar.gz), got sealed=${SEALED_COUNT} files=${RES_FILE_COUNT}!" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"

          if [ "${NODE_ARCH}" = "arm64" ]; then
            BENCH_TMP="$(mktemp -d)"
            SELFTEST_JSON="${BENCH_TMP}/selftest.json"
            SELFTEST_VAULT="${BENCH_TMP}/selftest-vault"
            BENCH_VAULT="${BENCH_TMP}/bench-vault"
            BENCH_SWIFT="${BENCH_TMP}/bench.swift"
            BENCH_BIN="${BENCH_TMP}/bench"
            mkdir -p "${SELFTEST_VAULT}" "${BENCH_VAULT}"
            cleanup_arm64() {
              pkill -TERM -f "${BENCH_VAULT}" 2>/dev/null || true
              pkill -TERM -f "${SELFTEST_VAULT}" 2>/dev/null || true
              rm -rf "${BENCH_TMP}"
            }
            trap cleanup_arm64 EXIT

            echo "=== 1/2 Launching ${APP_BUNDLE} for WKWebView DOM + apps.tar.gz extraction + sidecar self-test ==="
            BELL_DESKTOP_EDITION="${{ matrix.edition }}" \
            BELL_DESKTOP_VAULT_DIR="${SELFTEST_VAULT}" \
            BELL_DESKTOP_SELFTEST_OUT="${SELFTEST_JSON}" \
              "${APP_BIN}"

            cat "${SELFTEST_JSON}"
            node --input-type=module - "${SELFTEST_JSON}" <<'EOF'
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (!report.ok) {
              throw new Error(`macOS runtime self-test failed: ${JSON.stringify(report)}`);
            }
            const renderedHeight = Math.max(
              Number(report.domReady?.mainHeight ?? 0),
              Number(report.domReady?.chromeHeight ?? 0),
              Number(report.domReady?.viewportHeight ?? 0),
              Number(report.domReady?.height ?? 0),
            );
            if (!report.domReady || renderedHeight < 36 || Number(report.domReady.textLength ?? 0) < 10) {
              throw new Error(`WKWebView failed to render visible DOM: ${JSON.stringify(report.domReady)}`);
            }
            if (report.installedWorkspaces < 1 || report.healthyRunningWorkspaces !== report.installedWorkspaces) {
              throw new Error(`Bundled sidecars unhealthy: ${report.healthyRunningWorkspaces}/${report.installedWorkspaces}`);
            }
            console.log(
              `VERIFIED macOS WKWebView DOM (${report.edition}): height=${renderedHeight}px, textLength=${report.domReady.textLength}, sidecars=${report.healthyRunningWorkspaces}/${report.installedWorkspaces}`,
            );
          EOF

            echo "=== 2/2 Compiling CoreGraphics stopwatch & measuring Cold + Warm NSWindow open latency ==="
            cat > "${BENCH_SWIFT}" <<'SWIFT'
            import CoreGraphics
            import Darwin
            import Foundation

            let args = CommandLine.arguments
            guard args.count >= 4 else {
              fputs("Usage: bell-launch-bench <app-bin> <edition> <vault-dir>\n", stderr)
              exit(2)
            }
            let appBin = args[1]
            let edition = args[2]
            let vaultDir = args[3]

            func hasOnscreenWindow(pid: pid_t) -> (Bool, String) {
              let opts: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
              guard let list = CGWindowListCopyWindowInfo(opts, kCGNullWindowID) as? [[String: Any]] else {
                return (false, "")
              }
              for w in list {
                let ownerPid = (w[kCGWindowOwnerPID as String] as? Int32) ?? Int32((w[kCGWindowOwnerPID as String] as? Int) ?? 0)
                if ownerPid != pid { continue }
                let onScreen = (w[kCGWindowIsOnscreen as String] as? Bool) ?? (((w[kCGWindowIsOnscreen as String] as? Int) ?? 0) != 0)
                let b = w[kCGWindowBounds as String] as? [String: Any] ?? [:]
                let width = b["Width"] as? Double ?? 0
                let height = b["Height"] as? Double ?? 0
                let owner = w[kCGWindowOwnerName as String] as? String ?? ""
                if onScreen && width >= 800 && height >= 550 {
                  return (true, "pid=\(pid) owner=\(owner) \(Int(width))x\(Int(height))")
                }
              }
              return (false, "")
            }

            func measureLaunch(label: String) -> Int {
              let proc = Process()
              proc.executableURL = URL(fileURLWithPath: appBin)
              var env = ProcessInfo.processInfo.environment
              env["BELL_DESKTOP_EDITION"] = edition
              env["BELL_DESKTOP_VAULT_DIR"] = vaultDir
              env.removeValue(forKey: "BELL_DESKTOP_SELFTEST_OUT")
              proc.environment = env

              let logUrl = URL(fileURLWithPath: "/tmp/bell-bench-\(label).log")
              FileManager.default.createFile(atPath: logUrl.path, contents: nil)
              let logHandle = try! FileHandle(forWritingTo: logUrl)
              proc.standardOutput = logHandle
              proc.standardError = logHandle

              let t0 = DispatchTime.now().uptimeNanoseconds
              do {
                try proc.run()
              } catch {
                fputs("Failed to launch \(appBin): \(error)\n", stderr)
                exit(1)
              }
              let pid = proc.processIdentifier
              var elapsedMs = -1
              var detail = ""
              let deadlineNs = t0 + 12_000_000_000

              while DispatchTime.now().uptimeNanoseconds < deadlineNs {
                if !proc.isRunning {
                  fputs("ERROR [\(label)]: \(appBin) exited early (status=\(proc.terminationStatus))\n", stderr)
                  exit(1)
                }
                let (ok, info) = hasOnscreenWindow(pid: pid)
                if ok {
                  let nowNs = DispatchTime.now().uptimeNanoseconds
                  elapsedMs = Int((nowNs - t0) / 1_000_000)
                  detail = info
                  break
                }
                usleep(40_000)
              }

              proc.terminate()
              let killDeadline = DispatchTime.now().uptimeNanoseconds + 3_000_000_000
              while proc.isRunning && DispatchTime.now().uptimeNanoseconds < killDeadline {
                usleep(50_000)
              }
              if proc.isRunning {
                kill(pid, SIGKILL)
              }
              proc.waitUntilExit()
              try? logHandle.close()

              if elapsedMs < 0 {
                fputs("ERROR [\(label)]: timed out waiting for onscreen NSWindow (>=800x550)\n", stderr)
                if let logText = try? String(contentsOf: logUrl, encoding: .utf8) {
                  fputs(logText + "\n", stderr)
                }
                exit(1)
              }
              print("ONSCREEN_WINDOW_OK [\(label)] \(detail) openMs=\(elapsedMs)")
              return elapsedMs
            }

            let coldMs = measureLaunch(label: "cold")
            usleep(300_000)
            let warmMs = measureLaunch(label: "warm")
            print("COLD_WINDOW_OPEN_MS=\(coldMs)")
            print("WARM_WINDOW_OPEN_MS=\(warmMs)")
            if warmMs >= 2000 {
              fputs("ERROR: WARM_WINDOW_OPEN_MS (\(warmMs)ms) exceeded 2000ms gate!\n", stderr)
              exit(1)
            }
          SWIFT

            # Pre-compile Swift stopwatch binary BEFORE starting any launch timer
            swiftc -O "${BENCH_SWIFT}" -o "${BENCH_BIN}"
            "${BENCH_BIN}" "${APP_BIN}" "${{ matrix.edition }}" "${BENCH_VAULT}"
          fi

          BUNDLE_DIR="$(dirname "${APP_BUNDLE}")"
          APP_BASE="$(basename "${APP_BUNDLE}" .app)"
          DOT_SLUG="$(printf '%s' "${APP_BASE}" | tr ' ' '.')"
          rm -f "${BUNDLE_DIR}"/*.app.tar.gz "${BUNDLE_DIR}"/*.app.tar.gz.sig
          COPYFILE_DISABLE=1 tar -czf "${BUNDLE_DIR}/${DOT_SLUG}_${BUNDLE_ARCH}.app.tar.gz" \
            -C "${BUNDLE_DIR}" "$(basename "${APP_BUNDLE}")"

      - name: Upload verified macOS installers to GitHub Release
        if: ${{ runner.os == 'macOS' && needs.create-release.outputs.release_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_TARGET: ${{ matrix.platform.rust_targets }}
          BUNDLE_ARCH: ${{ matrix.platform.bundle_arch }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          files=(
            desktop/target/"${RUST_TARGET}"/release/bundle/dmg/*.dmg
            desktop/target/"${RUST_TARGET}"/release/bundle/macos/*_"${BUNDLE_ARCH}".app.tar.gz
          )
          if [ "${#files[@]}" -lt 2 ]; then
            echo "Missing expected macOS release assets: ${files[*]}" >&2
            exit 1
          fi
          gh release upload "${TAG_NAME}" "${files[@]}" --clobber

      - name: Upload verified Windows installers to GitHub Release
        if: ${{ runner.os == 'Windows' && needs.create-release.outputs.release_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagName = $env:GITHUB_REF -replace '^refs/tags/', ''
          $msiFiles = @(Get-ChildItem -Path "desktop\target\x86_64-pc-windows-msvc\release\bundle\msi\*.msi")
          $nsisFiles = @(Get-ChildItem -Path "desktop\target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe")
          $allFiles = @($msiFiles + $nsisFiles) | ForEach-Object { $_.FullName }
          if ($allFiles.Count -lt 2) {
            throw "Missing expected Windows release assets ($($allFiles.Count) found)"
          }
          gh release upload $tagName @allFiles --clobber

      - name: Upload installer artifacts (${{ matrix.edition }} - ${{ matrix.platform.os_label }})
        uses: actions/upload-artifact@v4
        with:
          name: bell-${{ matrix.edition }}-${{ matrix.platform.os_label }}
          path: |
            desktop/target/*/release/bundle/dmg/*.dmg
            desktop/target/*/release/bundle/macos/*.app.tar.gz
            desktop/target/*/release/bundle/msi/*.msi
            desktop/target/*/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
